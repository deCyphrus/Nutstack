<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Chunky toy-metal, not realistic - matches your game tiles -->
    <linearGradient id="nutFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="12%" stop-color="#F2F4F7"/>
      <stop offset="50%" stop-color="#D8DDE6"/>
      <stop offset="100%" stop-color="#9AA3B2"/>
    </linearGradient>
    <!-- Inner hole pop - your signature yellow sun tile -->
    <radialGradient id="holePop" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </radialGradient>
  </defs>

  <!-- Tilted for life/energy like your stacked tiles -->
  <g transform="translate(64 64) rotate(-12)">
    <!-- Heavy shadow for depth - like your game tiles have -->
    <path d="M 0 -42 L 36.37 -21 L 36.37 21 L 0 42 L -36.37 21 L -36.37 -21 Z" 
          fill="#1A1F2B" opacity="0.18" transform="translate(0,6)"/>
    
    <!-- Main hex nut - thick, friendly, rounded joins -->
    <path d="M 0 -40 L 34.64 -20 L 34.64 20 L 0 40 L -34.64 20 L -34.64 -20 Z"
          fill="url(#nutFill)"
          stroke="#1E293B"
          stroke-width="7"
          stroke-linejoin="round"
          stroke-linecap="round"/>
    
    <!-- Top shine - gives it plastic toy life -->
    <path d="M 0 -40 L 34.64 -20 L 34.64 -8 L 10 -24 L -10 -24 L -34.64 -8 L -34.64 -20 Z"
          fill="white" opacity="0.55"/>

    <!-- Inner hole - bold outline for tiny sizes -->
    <circle cx="0" cy="0" r="17" fill="url(#holePop)" stroke="#1E293B" stroke-width="6.5"/>
    
    <!-- Tiny highlight in hole for sparkle -->
    <circle cx="-4" cy="-4" r="4" fill="white" opacity="0.7"/>
  </g>
</svg>
